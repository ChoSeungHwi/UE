name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 미러 저장소에 새 패치가 올라오면 버전·다운로드 링크가 반영되도록 매일 다시 빌드 (03:00 KST)
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # Pages 주소를 알려줌: 프로젝트 페이지면 base_path=/UE, 커스텀 도메인이면 빈 값
      - id: pages
        uses: actions/configure-pages@v6

      - run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
